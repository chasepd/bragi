name: AgentSync Auto Sync

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - .agentsync/**
      - .codex/hooks.json
      - .codex/hooks/**
      - .codex/skills/**
      - .github/workflows/agentsync-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate AgentSync patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Install AgentSync
        env:
          AGENTSYNC_REF: a192b2a4ab4b4b13092a629bd21ff4edaa9fe8ef
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/agentsync-source"
          rm -rf "$source_dir"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/chasepd/AgentSync.git
          git -C "$source_dir" fetch --depth 1 origin "$AGENTSYNC_REF"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          cargo install --path "$source_dir/crates/agentsync-cli" --locked

      - name: Run AgentSync
        run: agentsync sync --all --write

      - name: Detect allowed changes
        id: changes
        run: |
          set -euo pipefail
          allowed_paths=(
            AGENTS.md
            CLAUDE.md
            .agentsync
            .claude
            .codex/hooks.json
            .codex/hooks
            .codex/skills
            .cursor
            .opencode
          )
          git add -A -- "${allowed_paths[@]}"
          unexpected_paths="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed -n '1,20p')"
          if [ -n "$unexpected_paths" ]; then
            echo "::error title=Unexpected AgentSync changes::AgentSync changed paths outside the allowlist."
            printf '%s\n' "$unexpected_paths"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --binary > "$RUNNER_TEMP/agentsync.patch"
          fi

      - name: Upload AgentSync patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentsync-changes
          path: ${{ runner.temp }}/agentsync.patch
          if-no-files-found: error

  publish:
    name: Publish AgentSync PR
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: agentsync-sync-pr-${{ github.repository }}-agentsync/auto-sync
      cancel-in-progress: false

    steps:
      - name: Apply and publish AgentSync patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: main
          BRANCH: agentsync/auto-sync
          PR_TITLE: Sync agent configuration
          PR_BODY: |
            AgentSync generated updates from the canonical Bragi agent configuration so native agent files stay in sync.
        run: |
          set -euo pipefail
          repo_dir="$GITHUB_WORKSPACE/repo"
          artifact_dir="$RUNNER_TEMP/agentsync-artifact"
          body_file="$RUNNER_TEMP/agentsync-pr-body.md"

          mkdir -p "$artifact_dir"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name agentsync-changes --dir "$artifact_dir"

          git init "$repo_dir"
          git -C "$repo_dir" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$repo_dir" fetch --depth 1 origin "$BASE_BRANCH"
          git -C "$repo_dir" switch -C "$BASE_BRANCH" FETCH_HEAD
          git -C "$repo_dir" fetch --depth 1 origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git -C "$repo_dir" apply --index "$artifact_dir/agentsync.patch"

          if git -C "$repo_dir" diff --cached --quiet; then
            exit 0
          fi

          git -C "$repo_dir" config user.name "github-actions[bot]"
          git -C "$repo_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo_dir" switch -C "$BRANCH"
          git -C "$repo_dir" commit -m "Sync agent configuration"
          git -C "$repo_dir" push --force-with-lease origin "$BRANCH"

          printf '%s\n' "$PR_BODY" > "$body_file"

          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --title "$PR_TITLE" --body-file "$body_file"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$BRANCH" --title "$PR_TITLE" --body-file "$body_file"
          fi
