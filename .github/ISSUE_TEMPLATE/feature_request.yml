name: Feature request
description: Propose a focused improvement to Bragi.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep examples fictional and generic. Do not include private roleplay content, save exports, generated personal media, or identifying details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Bragi do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you considered?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: My examples are fictional, generic, and contain no identifying details.
          required: true
